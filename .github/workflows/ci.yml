name: CI Pipeline

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: legal_ai_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic database migrations
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/legal_ai_test_db
          APP_ENV: test
          DEBUG: "true"
          JWT_SECRET_KEY: ci-test-jwt-secret-key-minimum-32-characters-long
          GEMINI_API_KEY: ci-mock-gemini-key
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest test suite
        env:
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/legal_ai_test_db
          APP_ENV: test
          DEBUG: "true"
          JWT_SECRET_KEY: ci-test-jwt-secret-key-minimum-32-characters-long
          GEMINI_API_KEY: ci-mock-gemini-key
          CHROMA_PERSIST_DIR: ./test_chroma_data
          UPLOAD_DIR: ./test_uploads
        run: |
          PYTHONPATH=.:backend pytest backend/tests/ -v --maxfail=5

  frontend-checks:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend typecheck & lint
        run: |
          cd frontend
          npm run lint

      - name: Frontend production build
        run: |
          cd frontend
          npm run build

  docker-validation:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config || docker-compose config
